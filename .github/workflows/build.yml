name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Build
        run: |
          cd src
          qmake edge-tts-gui.pro
          nmake release

      - name: Deploy
        run: |
          cd src/release
          windeployqt --no-translations edge-tts-gui.exe

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: edge-tts-gui
          path: src/release/edge-tts-gui.exe
