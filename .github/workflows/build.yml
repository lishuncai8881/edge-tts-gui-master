name: Build Qt App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        install-deps: true

    - name: Build
      shell: powershell
      run: |
        cd src
        qmake edge-tts-gui.pro
        nmake

    - name: Deploy
      shell: powershell
      run: |
        cd src/release
        windeployqt --no-translations --no-system-d3d-compiler --no-angle --no-opengl-sw edge-tts-gui.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: edge-tts-gui
        path: src/release/edge-tts-gui.exe
