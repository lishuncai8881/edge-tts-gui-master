name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 安装 Qt 5.15.2（用官方的安装脚本，不用第三方action）
      - name: Install Qt
        run: |
          winget install QtProject.QtCreator --silent
          winget install QtProject.Qt.5.15.2 --silent

      # 把 Qt 工具链加到环境变量
      - name: Set PATH
        run: |
          echo "C:\Qt\5.15.2\msvc2019_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # 编译项目
      - name: Build
        run: |
          cd src
          qmake edge-tts-gui.pro
          nmake release

      # 打包依赖
      - name: Deploy
        run: |
          cd src/release
          windeployqt --no-translations edge-tts-gui.exe

      # 上传文件
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: edge-tts-gui
          path: src/release/edge-tts-gui.exe
