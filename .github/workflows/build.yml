
name: Build with Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: qtproject/qt:5.15.2-mingw810

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build project
      run: |
        cd src
        qmake edge-tts-gui.pro
        make -j$(nproc)

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: edge-tts-gui
        path: src/release/edge-tts-gui.exe
